name: Sync Week 04 Practice Checkboxes
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-week04.yml'
permissions:
  contents: write
jobs:
  sync-checkboxes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render practice lists as checkboxes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pages/lecture-week04.html')
          html = p.read_text(encoding='utf-8')

          # Notion practice blocks are to-do lists. Keep their text and render each
          # practice list item with a native checkbox in the webview.
          def convert(match):
              block = match.group(0)
              def item(m):
                  body = m.group(1)
                  if 'type="checkbox"' in body:
                      return m.group(0)
                  return '<li><label class="lc-check"><input type="checkbox"> <span>' + body + '</span></label></li>'
              return re.sub(r'<li>(.*?)</li>', item, block, flags=re.S)

          html, count = re.subn(r'<div class="lc-practice">.*?</div>', convert, html, flags=re.S)
          if count == 0:
              raise SystemExit('No practice blocks found')

          marker = '.lc-practice ul{margin-bottom:0}'
          css = '.lc-practice ul{margin-bottom:0;list-style:none;padding-left:0}.lc-check{display:flex;align-items:flex-start;gap:10px;cursor:pointer;line-height:1.65}.lc-check input{width:18px;height:18px;margin-top:4px;flex:0 0 auto;accent-color:#5266e8}.lc-check span{flex:1}'
          if marker in html:
              html = html.replace(marker, css, 1)

          p.write_text(html, encoding='utf-8')
      - name: Commit checkbox sync
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/lecture-week04.html
          git diff --cached --quiet && exit 0
          git commit -m "Sync week 04 practice checkboxes"
          git push

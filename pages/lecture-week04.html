<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WEEK 04 · 보호된 강의교안</title>
<style>
body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0d1020;color:#111}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
.card{width:min(440px,100%);background:#fff;border-radius:22px;padding:32px;box-shadow:0 30px 90px rgba(0,0,0,.35)}
h1{font-size:22px;margin:0 0 8px}.desc{color:#667085;line-height:1.65}.form{display:flex;gap:8px;margin-top:18px}
input{flex:1;min-width:0;border:1px solid #d0d5dd;border-radius:10px;padding:12px 14px;font:inherit}
button{border:0;border-radius:10px;background:#5b4de3;color:#fff;padding:12px 16px;font:inherit;font-weight:700;cursor:pointer}
.err{color:#c4320a;font-size:13px;margin:10px 0 0}
</style>
</head>
<body>
<main class="gate"><section class="card"><div style="font-size:32px">🔒</div><h1>4주차 강의교안</h1>
<p class="desc">비밀번호 확인 후 교안 페이지에 접속할 수 있습니다.</p>
<form class="form" id="f"><input id="p" type="password" autocomplete="off" placeholder="비밀번호"><button type="submit">접속하기</button></form>
<p class="err" id="e" hidden>비밀번호가 올바르지 않습니다.</p></section></main>
<script>
(()=>{'use strict';
  const enc=new TextEncoder(),dec=new TextDecoder();
  const b64=s=>{const b=atob(s),o=new Uint8Array(b.length);for(let i=0;i<b.length;i++)o[i]=b.charCodeAt(i);return o};
  async function decrypt(password,payload){
    const m=await crypto.subtle.importKey('raw',enc.encode(password),'PBKDF2',false,['deriveKey']);
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(payload.salt),iterations:payload.iterations,hash:'SHA-256'},m,{name:'AES-GCM',length:256},false,['decrypt']);
    return dec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(payload.iv)},k,b64(payload.data)));
  }
  function withPracticeLocks(html){
    const lockStyle=`<style id="week04-practice-lock-style">.lc-practice{visibility:hidden}.lc-practice.w4-lock-ready{visibility:visible}.w4-practice-gate{padding:28px 22px;text-align:center;border:1px solid #d9dcec;border-radius:12px;background:#f7f8ff}.w4-practice-gate .w4-lock-icon{font-size:28px;margin:0 0 8px}.w4-practice-gate .w4-lock-title{font-weight:700;color:#303b69;margin:0 0 6px}.w4-practice-gate .w4-lock-desc{color:#667085;margin:0 0 14px}.w4-practice-gate form{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}.w4-practice-gate input{width:220px;max-width:70vw;border:1px solid #cfd4e6;border-radius:999px;padding:10px 14px;font:inherit}.w4-practice-gate button{border:0;border-radius:999px;background:#5266e8;color:#fff;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}.w4-practice-gate .w4-lock-error{margin:10px 0 0;color:#c4320a;font-size:13px}</style>`;
    const lockScript=`<script>(()=>{'use strict';const targetHash='9a474d9446107e9c48c74170d56e739dbaa3a188d458ea0777f675edfcd6f6bf';const enc=new TextEncoder();const hex=b=>Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');const blocks=[...document.querySelectorAll('.lc-practice')];const originals=blocks.map(b=>b.innerHTML);let unlocked=false;async function ok(v){return hex(await crypto.subtle.digest('SHA-256',enc.encode(v)))===targetHash}function openAll(){unlocked=true;blocks.forEach((b,i)=>{b.innerHTML=originals[i];b.classList.add('w4-lock-ready')})}blocks.forEach((b,i)=>{b.innerHTML='<div class="w4-practice-gate"><p class="w4-lock-icon">🔒</p><p class="w4-lock-title">비밀번호가 필요한 실습입니다</p><p class="w4-lock-desc">실습 내용은 비밀번호 확인 후 열람할 수 있습니다.</p><form><input type="password" autocomplete="off" placeholder="실습 비밀번호"><button type="submit">열람하기</button></form><p class="w4-lock-error" hidden>비밀번호가 올바르지 않습니다.</p></div>';b.classList.add('w4-lock-ready');const f=b.querySelector('form'),inp=b.querySelector('input'),err=b.querySelector('.w4-lock-error');f.addEventListener('submit',async e=>{e.preventDefault();err.hidden=true;if(unlocked||await ok(inp.value)){openAll()}else{err.hidden=false;inp.value='';inp.focus()}})});})();<\/script>`;
    return html.replace('</head>',lockStyle+'</head>').replace('</body>',lockScript+'</body>');
  }
  document.getElementById('f').addEventListener('submit',async e=>{
    e.preventDefault();const p=document.getElementById('p'),err=document.getElementById('e');err.hidden=true;
    try{const r=await fetch('week04-full.enc.json',{cache:'no-store'});const payload=await r.json();const html=withPracticeLocks(await decrypt(p.value,payload));document.open();document.write(html);document.close();}
    catch(_){err.hidden=false;p.value='';p.focus();}
  });
})();
</script>
</body></html>

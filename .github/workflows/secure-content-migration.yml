name: One-time secure content migration

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/secure-content-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run migration
        run: node tools/secure-content-migration.js
      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Secure password-protected lecture content"
          git push
# retry after vault encryption fix

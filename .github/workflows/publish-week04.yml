name: Fix Week 04 Webview
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-week04.yml'
permissions:
  contents: write
jobs:
  fix-week04:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix password gate and H1 section images
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('pages/lecture-week04.html')
          html = p.read_text(encoding='utf-8')

          # Match the 1~3 week pattern: major Notion H1 sections use lc-h1 + banner image.
          sections = [
              ('s1', '1. 문제 발견', '4_1.png', '문제 발견'),
              ('s2', '2. 문제를 프로젝트 아이디어로 바꾸기', '4_2.png', '문제를 프로젝트 아이디어로 바꾸기'),
              ('s3', '3. 1차 후보 3~5개 선정', '4_3.png', '1차 후보 3~5개 선정'),
              ('s4', '4. 아이디어 가능성 탐색', '4_4.png', '아이디어 가능성 탐색'),
              ('s5', '5. 대학생 팀 프로젝트 수행 가능성 점검', '4_5.png', '대학생 팀 프로젝트 수행 가능성 점검'),
              ('s6', '6. 프로젝트 후보 2개 선정', '4_6.png', '프로젝트 후보 2개 선정'),
          ]
          for sid, title, image, alt in sections:
              old = f'<h2 class="lc-h2" id="{sid}">{title}</h2>'
              new = f'<h1 class="lc-h1" id="{sid}">{title}</h1><figure class="lc-banner"><img src="../assets/img/{image}" alt="{alt}" loading="lazy"></figure>'
              if old in html:
                  html = html.replace(old, new, 1)
              elif f'id="{sid}"' not in html or f'../assets/img/{image}' not in html:
                  raise SystemExit(f'Could not update {sid}')

          # Every entry to Week 04 must require the password again.
          old_gate = "var key='week04-lecture-unlocked';try{if(sessionStorage.getItem(key)==='1')gate.hidden=true;}catch(e){}form.addEventListener('submit',function(e){e.preventDefault();if(input.value==='2468'){gate.hidden=true;err.hidden=true;try{sessionStorage.setItem(key,'1');}catch(x){}}else{err.hidden=false;input.value='';input.focus();}});"
          new_gate = "form.addEventListener('submit',function(e){e.preventDefault();if(input.value==='2468'){gate.hidden=true;err.hidden=true;}else{err.hidden=false;input.value='';input.focus();}});"
          if old_gate in html:
              html = html.replace(old_gate, new_gate, 1)
          else:
              html = re.sub(r"var key='week04-lecture-unlocked';try\{if\(sessionStorage\.getItem\(key\)==='1'\)gate\.hidden=true;\}catch\(e\)\{\}", '', html, count=1)
              html = re.sub(r"try\{sessionStorage\.setItem\(key,'1'\);\}catch\(x\)\{\}", '', html, count=1)

          p.write_text(html, encoding='utf-8')
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pages/lecture-week04.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix week 04 password gate and section banners"
          git push
